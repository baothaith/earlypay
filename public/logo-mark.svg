<!-- EarlyPay logomark — "window capture" concept.
     Two vertical brackets frame a forward-pointing chevron.
     The brackets = the payment window; the chevron = early settlement moving through it.
     On dark: accent #acc6e9 on transparent.
     On light: deep-navy #0d1b2f on white.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="ep-g" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd8f0"/>
      <stop offset="100%" stop-color="#acc6e9"/>
    </linearGradient>
  </defs>
  <!-- Left bracket -->
  <path d="M13 9 L9 9 L9 31 L13 31" stroke="url(#ep-g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right bracket -->
  <path d="M27 9 L31 9 L31 31 L27 31" stroke="url(#ep-g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Forward chevron — early settlement arrow -->
  <path d="M15.5 20 L22 14.5 L28.5 20 L22 25.5 Z" fill="url(#ep-g)" opacity="0.18"/>
  <path d="M15 20 L22 14 L22 25 Z" fill="url(#ep-g)" opacity="0.55"/>
  <path d="M22 14 L29 20 L22 26" stroke="url(#ep-g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
