<!-- EarlyPay primary logo — mark + wordmark, dark version -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <defs>
    <linearGradient id="ep-pg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd8f0"/>
      <stop offset="100%" stop-color="#acc6e9"/>
    </linearGradient>
  </defs>
  <!-- Mark (40×40) -->
  <path d="M13 9 L9 9 L9 31 L13 31" stroke="url(#ep-pg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M27 9 L31 9 L31 31 L27 31" stroke="url(#ep-pg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M15 20 L22 14 L22 26 Z" fill="url(#ep-pg)" opacity="0.55"/>
  <path d="M22 14 L29 20 L22 26" stroke="url(#ep-pg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Wordmark -->
  <text x="46" y="26" font-family="'Space Grotesk', 'DM Sans', sans-serif" font-weight="700" font-size="17" letter-spacing="-0.5" fill="#f9faf3">Early</text>
  <text x="95" y="26" font-family="'Space Grotesk', 'DM Sans', sans-serif" font-weight="700" font-size="17" letter-spacing="-0.5" fill="#acc6e9">Pay</text>
</svg>
